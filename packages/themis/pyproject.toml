# Themis — the ablation rig. Pre-registration, matched budgets, seed management,
# run execution, aggregation, reporting. Contains argus/ (telemetry) and data/
# (loaders) as modules until either earns its own package.
# Dependencies: torch, proteus, mnemosyne. Themis sits on top of everything.

[project]
name = "themis"
version = "0.1.0"
description = "Controlled-comparison ablation rig: pre-registered hypotheses, matched param/token budgets, seeds, execution, aggregation, reporting."
requires-python = ">=3.11"
dependencies = ["torch", "proteus", "mnemosyne"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/themis"]
