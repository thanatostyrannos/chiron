# Proteus — the model architecture. Decoder, attention variants, MoE, positional
# schemes; the full configurable surface (every ablation axis is a config field).
# Dependencies: torch, mnemosyne. Proteus requests cache from Mnemosyne through
# Mnemosyne's public interface; the dependency points this way only.

[project]
name = "proteus"
version = "0.1.0"
description = "Configurable decoder-only model: per-layer attention type, interleaving ratio, MoE gating, positional scheme. Protean by construction."
requires-python = ">=3.11"
dependencies = ["torch", "mnemosyne"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteus"]
